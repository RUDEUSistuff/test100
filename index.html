<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=5.0, viewport-fit=cover">
  <title>قارئ النصوص التفاعلي | Arabic TTS Reader</title>
  
  <!-- خطوط عربية -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  
  <!-- Font Awesome للأيقونات -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <!-- ملف التنسيقات -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1><i class="fas fa-headphones"></i> قارئ النصوص</h1>
      <button class="theme-toggle" id="themeToggle" aria-label="تغيير المظهر">
        <i class="fas fa-moon"></i>
      </button>
    </div>

    <!-- منطقة رفع الملف -->
    <div class="upload-area" id="uploadArea">
      <i class="fas fa-cloud-upload-alt upload-icon"></i>
      <p class="upload-text">اسحب وأفلِت ملف (PDF/TXT) أو انقر هنا</p>
      <p style="color: #94a3b8; font-size: 0.85rem;">يدعم الملفات النصية و PDF</p>
      <p class="file-name" id="fileName"></p>
      <input type="file" id="fileInput" accept=".txt,.pdf">
    </div>

    <!-- عرض النص المستخرج -->
    <div class="text-display" id="textDisplay">
      <p id="textContent" style="color: #64748b;">... مرحباً، ارفع ملفاً للبدء</p>
    </div>

    <!-- شريط التقدم -->
    <div class="progress-container" id="progressContainer">
      <div class="progress-bar" id="progressBar" style="width: 0%;"></div>
    </div>

    <!-- أزرار التحكم -->
    <div class="controls">
      <button class="control-btn" id="stopBtn" title="إيقاف">
        <i class="fas fa-stop"></i>
      </button>
      <button class="control-btn" id="pauseBtn" title="إيقاف مؤقت">
        <i class="fas fa-pause"></i>
      </button>
      <button class="control-btn play-btn" id="playBtn" title="تشغيل">
        <i class="fas fa-play"></i>
      </button>
      <button class="control-btn" id="resumeBtn" title="استئناف">
        <i class="fas fa-forward"></i>
      </button>
      
      <div class="speed-slider">
        <label for="speedRange"><i class="fas fa-tachometer-alt"></i></label>
        <input type="range" id="speedRange" min="0.5" max="2" step="0.1" value="1">
        <span id="speedValue">1x</span>
      </div>
    </div>
  </div>

  <!-- مكتبة PDF.js لاستخراج النص -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  
  <!-- ملف الجافاسكريبت -->
  <script src="script.js"></script>
</body>
</html>
